<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RSVP – Shane & Stephanie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<nav class="nav jimthorpe-font">
    <a href="index.html">Home</a>
    <a href="our-story.html">Our Story</a>
    <a href="gallery.html">Gallery</a>
    <a href="weekend-schedule.html">Weekend Schedule</a>
    <a href="rsvp2.html" class="active">RSVP</a>
    <a href="registry.html">Registry</a>
    <a href="guest-area.html">Guest Area</a>
    <a href="parking.html">Parking</a>
    <a href="things-to-do.html">Things To Do</a>
</nav>

<main class="container fade-section">

    <h2 class="section-title jimthorpe-font">RSVP / Request Invite</h2>
    <div class="gold-divider"></div>

    <form id="rsvpForm" class="rsvp-form">

        <!-- Invisible bot trap -->
        <input type="text" id="trap" name="trap" style="display:none;">

        <label for="name">Name for what the Post Office calls you.</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="attending">Are you going to be able to make it?</label>
        <select id="attending" name="attending" required>
            <option value="">Select one</option>
            <option value="Yes">Yes, I can't wait to be there to celebrate with you two.</option>
            <option value="No">No, sorry I can't make it and I have a really great excuse.</option>
        </select>

        <label for="invitationOnly">Would you like a real fancy paper invitation in the mail?</label>
        <select id="invitationOnly" name="invitationOnly" required>
            <option value="">Select one</option>
            <option value="Yes">Yeah! Of Course I do, I want this on my fridge.</option>
            <option value="No">Nope, save the stamp.</option>
        </select>

        <label for="street">Street Address</label>
        <input type="text" id="street" name="street" required>

        <label for="city">City</label>
        <input type="text" id="city" name="city" required>

        <label for="state">State</label>
        <input type="text" id="state" name="state" required>

        <label for="zipcode">Zipcode</label>
        <input type="text" id="zipcode" name="zipcode" required>

        <label for="guests">Are you bringing any extra people?</label>
        <input type="number" id="guests" name="guests" min="0" required>

        <label for="message">Message (optional)</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <button type="submit" class="jimthorpe-font submit-btn">Submit RSVP</button>
    </form>

    <div id="status" class="jimthorpe-font" style="margin-top: 20px;"></div>

    <p class="note">Give it a second before leaving.</p>

</main>

<footer class="jimthorpe-font">
    <p>Shane & Stephanie • 2026</p>
</footer>

<script>
document.getElementById("rsvpForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (document.getElementById("trap").value !== "") {
        return;
    }

    const payload = {
        to: "shaneosparks@gmail.com",
        from: "shaneosparks@gmail.com",
        subject: `RSVP from ${document.getElementById("name").value}`,
        message: `
Name: ${document.getElementById("name").value}
Email: ${document.getElementById("email").value}
Attending: ${document.getElementById("attending").value}
Wants Invitation: ${document.getElementById("invitationOnly").value}

Address:
${document.getElementById("street").value}
${document.getElementById("city").value}, ${document.getElementById("state").value} ${document.getElementById("zipcode").value}

Guests Total: ${document.getElementById("guests").value}

Message:
${document.getElementById("message").value}
        
    };

    console.log("Submitting RSVP…");
    console.log("Payload:", payload);

    const status = document.getElementById("status");

    try {
        const response = await fetch("https://wedding-rsvp.shaneosparks.workers.dev/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        console.log("Fetch completed. Status:", response.status);

        if (response.ok) {
            status.innerText = "RSVP sent successfully!"; 
            status.style.color = "green";
            window.location.href = "thankyou.html";
        } else {
            const errorText = await response.text();
            console.log("Worker error text:", errorText);
            status.innerText = "Error: " + errorText;
            status.style.color = "red";
        }

    } catch (err) {
        console.error("NETWORK ERROR — Worker was NOT reached:", err);
        status.innerText = "Network error — Worker not reached.";
        status.style.color = "red";
    }
});
</script>

</body>
</html>
