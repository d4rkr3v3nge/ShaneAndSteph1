<main class="container fade-section">
    <form id="rsvpForm" onsubmit="submitRSVP(event)">
    
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for="attending">Will you be attending?</label>
    <select id="attending" name="attending" required>
        <option value="">Select one</option>
        <option value="Yes">Yes, I will be there</option>
        <option value="No">No, I cannot attend</option>
    </select>

    <label for="guests">Number of Guests</label>
    <input type="number" id="guests" name="guests" min="0" required>

    <label for="message">Message (optional)</label>
    <textarea id="message" name="message" rows="4"></textarea>

    <button type="submit" class="jimthorpe-font">Submit RSVP</button>
</form>

    <h2 class="section-title">RSVP / Request Invite</h2>
    <div class="gold-divider"></div>

    <form id="rsvpForm" onsubmit="submitRSVP(event)">
        <label>Name</label>
        <input type="text" name="name" required class="form-control">

        <label>Email</label>
        <input type="email" name="email" required class="form-control">

        <label>Attending?</label>
        <select name="attending" class="form-control">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
            <option value="Unsure">Unsure</option>
        </select>

        <label>Number of Guests</label>
        <input type="number" name="guests" min="1" class="form-control">

        <label>Message / Notes</label>
        <textarea name="message" class="form-control"></textarea>

        <button class="btn submit-btn" type="submit">Submit RSVP</button>
    </form>

    <p class="note">Your RSVP will be recorded and we’ll follow up with official details.</p>
</main>

<footer>
    <p>Shane & Stephanie • 2026</p>
</footer>

<script src="js/rsvp.js"></script>
</body>
