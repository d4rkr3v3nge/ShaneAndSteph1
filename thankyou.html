<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You – Shane & Stephanie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Georgia:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f8f5f2;
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
            color: #4a3f35;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #7a1f1f;
            margin-bottom: 10px;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: #c9a97b;
            margin: 20px auto;
            border-radius: 2px;
        }

        p {
            font-size: 1.25rem;
            line-height: 1.7;
            margin: 20px 0;
        }

        .home-btn {
            display: inline-block;
            margin-top: 35px;
            padding: 12px 28px;
            background: #7a1f1f;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        .home-btn:hover {
            background: #5c1515;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Thank You</h1>
    <div class="divider"></div>

    <p>
        Shane and Stephanie are so grateful for your RSVP.
    </p>

    <p id="message">
        <!-- This message will be replaced dynamically based on attending status -->
        We’re looking forward to celebrating with you!
    </p>

    <h2>Your RSVP Details</h2>

<p><strong>Name:</strong> <span id="name"></span></p>
<p><strong>Email:</strong> <span id="email"></span></p>
<p><strong>Attending:</strong> <span id="attending"></span></p>
<p><strong>Street:</strong> <span id="street"></span></p>
<p><strong>City:</strong> <span id="city"></span></p>
<p><strong>State:</strong> <span id="state"></span></p>
<p><strong>Zipcode:</strong> <span id="zipcode"></span></p>
<p><strong>Guests:</strong> <span id="guests"></span></p>
<p><strong>Message:</strong> <span id="message"></span></p>


    <a href="index.html" class="home-btn">Return to Home</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);

  document.getElementById("name").textContent = params.get("name");
  document.getElementById("email").textContent = params.get("email");
  document.getElementById("attending").textContent = params.get("attending");
  document.getElementById("street").textContent = params.get("street");
  document.getElementById("city").textContent = params.get("city");
  document.getElementById("state").textContent = params.get("state");
  document.getElementById("zipcode").textContent = params.get("zipcode");
  document.getElementById("guests").textContent = params.get("guests");
  document.getElementById("message").textContent = params.get("message");
</script>

<script>
    // Detect attending status from URL parameters
    const params = new URLSearchParams(window.location.search);
    const attending = params.get("attending");

    const messageEl = document.getElementById("message");

    if (attending === "Yes") {
        messageEl.textContent = "Shane and Stephanie are looking forward to celebrating with you!";
    } else if (attending === "No") {
        messageEl.textContent = "Sorry to hear you can’t make it — but thank you for letting us know.";
    }
</script>

</body>
</html>
